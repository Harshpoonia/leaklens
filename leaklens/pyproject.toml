[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaklens"
version = "0.1.0"
description = "Find, explain and fix leaked API keys in your git history"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []  # stdlib + the git binary only

[project.scripts]
leaklens = "leaklens.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["leaklens"]
